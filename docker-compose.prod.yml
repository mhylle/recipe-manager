services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/mhylle/recipe-manager-backend:latest}
    build: !reset null
    container_name: recipe-manager-backend
    environment:
      - DATABASE_URL=postgresql://recipe_manager_user:${RECIPE_MANAGER_DB_PASSWORD}@mhylle-postgres:5432/recipe_manager_db
      - CORS_ORIGIN=https://mhylle.com
      - PORT=3000
      # Web Push signing pair for cooking timers that ring with the app closed.
      # No `:?` guard, unlike the MCP token: the backend treats absent keys as
      # "feature off" and serves everything else, so failing here would take the
      # whole app down over an optional capability.
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - ISSUE_MIRROR_TOKEN=${ISSUE_MIRROR_TOKEN:-}
      - ISSUE_MIRROR_REPO=${ISSUE_MIRROR_REPO:-mhylle/recipe-manager}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:mhylle@yahoo.com}
    ports:
      - "8006:3000"
    depends_on: !reset {}
    restart: unless-stopped
    networks:
      - mhylle_app-network

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/mhylle/recipe-manager-frontend:latest}
    build: !reset null
    container_name: recipe-manager-frontend
    ports:
      - "3007:80"
    restart: unless-stopped
    networks:
      - mhylle_app-network

  mcp:
    image: ${MCP_IMAGE:-ghcr.io/mhylle/recipe-manager-mcp:latest}
    build: !reset null
    container_name: recipe-manager-mcp
    environment:
      - PORT=3100
      - RECIPE_MANAGER_API_URL=http://recipe-manager-backend:3000/api
      # No default. The server refuses to start without it, which is the point —
      # this endpoint is public and its tools can delete recipes.
      - RECIPE_MANAGER_MCP_TOKEN=${RECIPE_MANAGER_MCP_TOKEN:?set RECIPE_MANAGER_MCP_TOKEN}
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped
    networks:
      - mhylle_app-network

networks:
  mhylle_app-network:
    external: true
