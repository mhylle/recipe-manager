name: Deploy Recipe Manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-recipe-manager
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      frontend-image: ${{ steps.meta.outputs.frontend-image }}
      backend-image: ${{ steps.meta.outputs.backend-image }}
      mcp-image: ${{ steps.meta.outputs.mcp-image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate version
        id: meta
        run: |
          VERSION="v$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "frontend-image=ghcr.io/${{ github.repository_owner }}/recipe-manager-frontend:$VERSION" >> $GITHUB_OUTPUT
          echo "backend-image=ghcr.io/${{ github.repository_owner }}/recipe-manager-backend:$VERSION" >> $GITHUB_OUTPUT
          echo "mcp-image=ghcr.io/${{ github.repository_owner }}/recipe-manager-mcp:$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/recipe-manager-backend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/recipe-manager-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            BASE_HREF=/recipe-manager/
          tags: |
            ghcr.io/${{ github.repository_owner }}/recipe-manager-frontend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/recipe-manager-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push MCP server
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-server
          file: ./mcp-server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/recipe-manager-mcp:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/recipe-manager-mcp:latest
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          BACKEND_IMAGE: ${{ needs.build.outputs.backend-image }}
          FRONTEND_IMAGE: ${{ needs.build.outputs.frontend-image }}
          MCP_IMAGE: ${{ needs.build.outputs.mcp-image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          # Secrets sourced from GitHub Secrets (NOT server .env). The server's
          # .env file historically held a password with `/` and `==` chars that
          # broke Prisma's DATABASE_URL parsing (P1013). Sourcing from GH
          # secrets + URL-safe password closes that. Phase 1 alignment too —
          # see SECURITY-HARDENING-PLAN.md.
          RECIPE_MANAGER_DB_PASSWORD: ${{ secrets.RECIPE_MANAGER_DB_PASSWORD }}
          # Bearer token for the public MCP endpoint. Same rule as every other
          # secret here: GitHub Secrets only, never the server's .env.
          RECIPE_MANAGER_MCP_TOKEN: ${{ secrets.RECIPE_MANAGER_MCP_TOKEN }}
          # Shared SSO signing key — verifies the auth_token cookie on write
          # routes. GitHub Secrets only: the server .env copy has historically
          # carried a trailing newline that breaks signature verification.
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # Machine credential for the MCP server, scoped to this app alone so a
          # compromise there cannot forge tokens for the rest of the estate.
          RECIPE_MANAGER_SERVICE_TOKEN: ${{ secrets.RECIPE_MANAGER_SERVICE_TOKEN }}
          # The SSO subject the MCP server acts as. Not a secret — it is a user
          # id that appears in every JWT this app verifies. It is here so machine
          # writes are attributed to a real person; without it the service-token
          # path is refused rather than writing rows nothing can later reach.
          RECIPE_MANAGER_SERVICE_USER: 97f9ac37-13ef-4bef-964a-5da09d776497
          # Web Push signing pair for cooking timers that ring with the app
          # closed. Deliberately NOT in the required-secrets check below: the
          # backend treats absent keys as "this feature is off" and still serves
          # everything else, so a missing key must not block a deploy.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # Not a secret — the contact address a push service uses to reach the
          # sender's operator about a misbehaving application server.
          VAPID_SUBJECT: mailto:mhylle@yahoo.com
          # Mirrors in-app defect and improvement reports onto GitHub issues.
          # NOT named GITHUB_* — GitHub reserves that prefix for secret names and
          # rejects `gh secret set GITHUB_ISSUE_TOKEN` outright.
          # A fine-grained PAT with Issues: write on this repo — the workflow's
          # own GITHUB_TOKEN is useless here, being valid only during a run.
          #
          # Also NOT in the required-secrets check: reports are saved to the
          # database first and mirrored second, so an absent token costs the
          # mirror and never a report.
          ISSUE_MIRROR_TOKEN: ${{ secrets.ISSUE_MIRROR_TOKEN }}
          ISSUE_MIRROR_REPO: mhylle/recipe-manager
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,MCP_IMAGE,GH_TOKEN,GH_ACTOR,RECIPE_MANAGER_DB_PASSWORD,RECIPE_MANAGER_MCP_TOKEN,JWT_SECRET,RECIPE_MANAGER_SERVICE_TOKEN,RECIPE_MANAGER_SERVICE_USER,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,VAPID_SUBJECT,ISSUE_MIRROR_TOKEN,ISSUE_MIRROR_REPO
          script: |
            set -e
            echo "=== Deploying Recipe Manager ==="
            echo "Backend: $BACKEND_IMAGE"
            echo "Frontend: $FRONTEND_IMAGE"
            echo "MCP: $MCP_IMAGE"

            # Fail before touching anything if the MCP token is missing. The MCP
            # process would refuse to start anyway; failing here makes the reason
            # obvious instead of surfacing as a crash-looping container.
            for required in RECIPE_MANAGER_MCP_TOKEN JWT_SECRET RECIPE_MANAGER_SERVICE_TOKEN; do
              eval "value=\$$required"
              if [ -z "$value" ]; then
                echo "$required secret is not set — refusing to deploy."
                echo "Set it with: gh secret set $required --repo mhylle/recipe-manager"
                exit 1
              fi
            done

            # Not fatal, unlike the loop above. Absent VAPID keys degrade to
            # timers that ring only while the app is open, which is worth a loud
            # line in the log but not worth refusing to ship the rest of the app.
            if [ -z "$ISSUE_MIRROR_TOKEN" ]; then
              echo "WARNING: ISSUE_MIRROR_TOKEN is not set — reports will be saved but not mirrored to GitHub issues."
              echo "  Create a fine-grained PAT with Issues: write on mhylle/recipe-manager, then:"
              echo "        gh secret set ISSUE_MIRROR_TOKEN --repo mhylle/recipe-manager"
            fi

            if [ -z "$VAPID_PUBLIC_KEY" ] || [ -z "$VAPID_PRIVATE_KEY" ]; then
              echo "WARNING: VAPID keys are not set — cooking timers will not ring on phones."
              echo "  Generate with: npx web-push generate-vapid-keys"
              echo "  Then: gh secret set VAPID_PUBLIC_KEY --repo mhylle/recipe-manager"
              echo "        gh secret set VAPID_PRIVATE_KEY --repo mhylle/recipe-manager"
            fi

            # Login to GHCR
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # Pull new images
            docker pull "$BACKEND_IMAGE"
            docker pull "$FRONTEND_IMAGE"
            docker pull "$MCP_IMAGE"

            # Stop existing containers
            docker stop recipe-manager-backend recipe-manager-frontend recipe-manager-mcp 2>/dev/null || true
            docker rm recipe-manager-backend recipe-manager-frontend recipe-manager-mcp 2>/dev/null || true

            # Ensure images directory exists for volume mount
            mkdir -p /home/mhylle/recipe-manager-images

            # Start backend
            docker run -d \
              --name recipe-manager-backend \
              --network mhylle_app-network \
              --restart unless-stopped \
              -e NODE_ENV=production \
              -e DATABASE_URL="postgresql://recipe_manager_user:${RECIPE_MANAGER_DB_PASSWORD}@mhylle-postgres:5432/recipe_manager_db" \
              -e CORS_ORIGIN="https://mhylle.com" \
              -e PORT=3000 \
              -e JWT_SECRET="${JWT_SECRET}" \
              -e RECIPE_MANAGER_SERVICE_TOKEN="${RECIPE_MANAGER_SERVICE_TOKEN}" \
              -e RECIPE_MANAGER_SERVICE_USER="${RECIPE_MANAGER_SERVICE_USER}" \
              -e VAPID_PUBLIC_KEY="${VAPID_PUBLIC_KEY}" \
              -e VAPID_PRIVATE_KEY="${VAPID_PRIVATE_KEY}" \
              -e VAPID_SUBJECT="${VAPID_SUBJECT}" \
              -e ISSUE_MIRROR_TOKEN="${ISSUE_MIRROR_TOKEN}" \
              -e ISSUE_MIRROR_REPO="${ISSUE_MIRROR_REPO}" \
              -v /home/mhylle/recipe-manager-images:/app/public/recipes \
              -p 127.0.0.1:8006:3000 \
              --health-cmd="curl -f http://localhost:3000/api/health || exit 1" \
              --health-interval=30s \
              --health-timeout=10s \
              --health-retries=3 \
              --health-start-period=60s \
              "$BACKEND_IMAGE"

            # Start frontend
            docker run -d \
              --name recipe-manager-frontend \
              --network mhylle_app-network \
              --restart unless-stopped \
              -e NODE_ENV=production \
              -p 127.0.0.1:3007:80 \
              --health-cmd="curl -sf http://localhost/health || exit 1" \
              --health-interval=30s \
              --health-timeout=10s \
              --health-retries=3 \
              --health-start-period=30s \
              "$FRONTEND_IMAGE"

            # Start MCP server.
            # Talks to the backend container directly rather than looping back
            # through nginx — one less hop, and it keeps working while nginx is
            # reloading. Port is bound to loopback only; public access is via the
            # nginx /mcp/recipe-manager route, which is bearer-token gated.
            docker run -d \
              --name recipe-manager-mcp \
              --network mhylle_app-network \
              --restart unless-stopped \
              -e NODE_ENV=production \
              -e PORT=3100 \
              -e RECIPE_MANAGER_API_URL="http://recipe-manager-backend:3000/api" \
              -e RECIPE_MANAGER_MCP_TOKEN="${RECIPE_MANAGER_MCP_TOKEN}" \
              -e RECIPE_MANAGER_SERVICE_TOKEN="${RECIPE_MANAGER_SERVICE_TOKEN}" \
              -p 127.0.0.1:3100:3100 \
              --health-cmd="wget -q -O- http://localhost:3100/health || exit 1" \
              --health-interval=30s \
              --health-timeout=10s \
              --health-retries=3 \
              --health-start-period=20s \
              "$MCP_IMAGE"

            # Wait for backend health
            echo "Waiting for backend to be healthy..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8006/api/health > /dev/null 2>&1; then
                echo "Backend is healthy!"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "Backend health check failed"
                docker logs recipe-manager-backend --tail 50
                exit 1
              fi
              sleep 2
            done

            # Wait for frontend health
            echo "Waiting for frontend to be healthy..."
            for i in $(seq 1 15); do
              if curl -sf http://localhost:3007/health > /dev/null 2>&1; then
                echo "Frontend is healthy!"
                break
              fi
              if [ $i -eq 15 ]; then
                echo "Frontend health check failed"
                docker logs recipe-manager-frontend --tail 20
                exit 1
              fi
              sleep 2
            done

            # Wait for MCP health
            echo "Waiting for MCP server to be healthy..."
            for i in $(seq 1 15); do
              if curl -sf http://localhost:3100/health > /dev/null 2>&1; then
                echo "MCP server is healthy!"
                break
              fi
              if [ $i -eq 15 ]; then
                echo "MCP health check failed"
                docker logs recipe-manager-mcp --tail 20
                exit 1
              fi
              sleep 2
            done

            # The endpoint is public, so prove the gate is actually closed rather
            # than assuming it. A 200 here would mean anyone can delete recipes.
            echo "Checking that unauthenticated MCP requests are rejected..."
            UNAUTH_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3100/mcp \
              -H 'Content-Type: application/json' -d '{}')
            if [ "$UNAUTH_STATUS" != "401" ]; then
              echo "MCP endpoint returned $UNAUTH_STATUS without a token, expected 401. Rolling back."
              docker stop recipe-manager-mcp && docker rm recipe-manager-mcp
              exit 1
            fi
            echo "Unauthenticated MCP request correctly rejected (401)."

            # Prove the write guard is closed, on the real deployed backend.
            # The DELETE targets a uuid that does not exist, so even a total
            # guard failure cannot destroy data — but it still distinguishes the
            # two outcomes: 401 means the guard ran first, 404 means it did not.
            echo "Checking the write guard..."
            GHOST=00000000-0000-0000-0000-000000000000
            DELETE_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "http://localhost:8006/api/recipes/$GHOST")
            # Status alone is ambiguous here: BilkaToGo answers 401 for bad
            # credentials too, so an unguarded endpoint that simply failed the
            # real login would look identical. Match the guard's own message.
            BILKA_BODY=$(curl -s -X POST http://localhost:8006/api/bilkatogo/login \
              -H 'Content-Type: application/json' -d '{"email":"probe@example.com","password":"probe"}')
            case "$BILKA_BODY" in
              *"Missing authentication token"*) BILKA_STATUS=401 ;;
              *) BILKA_STATUS="unguarded ($BILKA_BODY)" ;;
            esac
            # The control. Without a route that is SUPPOSED to be open, a
            # backend that 401s everything (or is simply down) would look like a
            # pass on both checks above.
            READ_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8006/api/recipes)

            echo "  DELETE /recipes/<ghost> -> $DELETE_STATUS (want 401)"
            echo "  POST /bilkatogo/login   -> $BILKA_STATUS (want 401)"
            echo "  GET /recipes            -> $READ_STATUS (want 200, control)"
            if [ "$DELETE_STATUS" != "401" ] || [ "$BILKA_STATUS" != "401" ] || [ "$READ_STATUS" != "200" ]; then
              echo "Write guard is not behaving as expected. Failing the deploy."
              docker logs recipe-manager-backend --tail 30
              exit 1
            fi
            echo "Write guard verified: writes rejected, reads still public."

            # --- Reclaim disk from superseded images ---------------------------
            #
            # `docker image prune -f` alone was NOT doing this. It only removes
            # DANGLING images, and every build we push is tagged
            # v<date>-<sha> as well as :latest. Pushing a new build moves
            # :latest but leaves the old image holding its version tag, so it is
            # never dangling and never collected — about 550 MB per backend
            # build, on every deploy, forever.
            #
            # Tags are removed oldest-first, keeping the most recent few so a
            # rollback still has something to roll back to.
            KEEP_IMAGES=3

            prune_old_images() {
              repo="$1"
              # Version tags sort chronologically because they start with the
              # date, so a reverse sort is newest-first. Deliberately not
              # trusting `docker images` ordering, which is by the image's own
              # build date — identical across anything retagged from one build.
              #
              # The `v<8 digits>-` filter is what protects :latest: it is not a
              # version tag, so it is never a candidate, and the image it points
              # at therefore always keeps at least one reference.
              docker images "$repo" --format '{{.Tag}}' 2>/dev/null \
                | grep -E '^v[0-9]{8}-' \
                | sort -r \
                | tail -n +$((KEEP_IMAGES + 1)) \
                | while IFS= read -r tag; do
                    # An image a container still uses cannot be removed, and
                    # must not be: that is the running deploy, or one someone
                    # rolled back to. Reported rather than treated as an error —
                    # and guarded by `if` so `set -e` does not abort the deploy
                    # over a reclaim that simply is not available yet.
                    if docker rmi "$repo:$tag" >/dev/null 2>&1; then
                      echo "    removed $repo:$tag"
                    else
                      echo "    still in use, left alone: $repo:$tag"
                    fi
                  done
            }

            echo "=== Reclaiming disk (keeping the newest $KEEP_IMAGES of each) ==="
            # Derived by stripping the tag off the images this deploy was handed,
            # rather than spelling the names out again — a second copy would be
            # free to drift away from what the build job actually pushes, and the
            # symptom of that drift is silence, not an error.
            for repo in \
              "${BACKEND_IMAGE%:*}" \
              "${FRONTEND_IMAGE%:*}" \
              "${MCP_IMAGE%:*}"; do
              echo "  $repo"
              prune_old_images "$repo"
            done

            # Still worth running: this is what actually frees the layers that
            # lost their last reference when the tags above went, and it prints
            # its own reclaimed total.
            #
            # Note that total can legitimately read 0B while tags were still
            # removed — layers shared with an image we keep are not freed until
            # the last thing referencing them is gone. The tag lines above are
            # the record of what happened; this line is the disk that came back.
            docker image prune -f

            echo "  kept per image:"
            for repo in \
              "${BACKEND_IMAGE%:*}" \
              "${FRONTEND_IMAGE%:*}" \
              "${MCP_IMAGE%:*}"; do
              echo "    $repo -> $(docker images "$repo" --format '{{.Tag}}' | sort | tr '\n' ' ')"
            done

            echo "=== Deployment complete ==="
            echo "Frontend: https://mhylle.com/recipe-manager/"
            echo "API: https://mhylle.com/api/recipe-manager/api"
            echo "MCP: https://mhylle.com/mcp/recipe-manager"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            sleep 15
            curl -f -s https://mhylle.com/recipe-manager/ > /dev/null && echo "Frontend accessible" || echo "Frontend check failed"
            curl -f -s https://mhylle.com/api/recipe-manager/api/health > /dev/null && echo "API accessible" || echo "API check failed"

  # Every build also leaves a version behind in the REGISTRY, which the server's
  # prune cannot reach. Unpruned, that is the copy that grows without limit and
  # is the one GitHub charges storage for.
  #
  # Its own job, after a successful deploy, because deleting a version the deploy
  # is about to pull would be self-inflicted. Deliberately NOT allowed to fail
  # the workflow: the app is already live and verified by this point, and losing
  # a housekeeping step is not worth reporting a good deploy as broken. A
  # permissions problem here shows up as a warning on a green run.
  prune-registry:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    permissions:
      packages: write
    strategy:
      # One at a time. Parallel deletes against the same registry are how the
      # 403s in this workflow's history started.
      max-parallel: 1
      matrix:
        package:
          - recipe-manager-backend
          - recipe-manager-frontend
          - recipe-manager-mcp
    steps:
      - name: Delete superseded versions of ${{ matrix.package }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          owner: ${{ github.repository_owner }}
          # More generous than the server's 3: registry storage is cheap next to
          # losing the ability to roll back to something from last month, and
          # once the server has pruned an old build this is the only copy left.
          #
          # This keeps the 10 NEWEST versions and deletes the rest. :latest is
          # safe because it always resolves to the newest version, which is
          # inside the kept window — so nothing can be deleted out from under a
          # `docker pull`. Lowering this number never changes that; setting it to
          # 0 would delete everything, including what is running.
          min-versions-to-keep: 10

  notify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "Recipe Manager deployed successfully!"
            echo "Version: ${{ needs.build.outputs.version }}"
            echo "Frontend: https://mhylle.com/recipe-manager/"
            echo "API: https://mhylle.com/api/recipe-manager/api"
          else
            echo "Deployment failed or was skipped"
            echo "Deploy result: ${{ needs.deploy.result }}"
          fi
