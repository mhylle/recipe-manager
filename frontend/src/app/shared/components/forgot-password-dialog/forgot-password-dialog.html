<dialog #dialog class="forgot" (close)="cancel()" [attr.aria-label]="'forgot.heading' | t">
  @if (sent()) {
    <div class="forgot__form">
      <h2 class="forgot__title">{{ 'forgot.sentHeading' | t }}</h2>
      <!-- Deliberately does not confirm whether that address had an account:
           anything else turns this form into a way to discover who is registered. -->
      <p class="forgot__intro">{{ 'forgot.sentBody' | t }}</p>
      <p class="forgot__note">{{ 'forgot.sentWhere' | t }}</p>

      <div class="forgot__actions">
        <button type="button" class="btn btn--primary btn--small" (click)="backToSignIn()">
          {{ 'login.signIn' | t }}
        </button>
      </div>
    </div>
  } @else {
    <form class="forgot__form" (ngSubmit)="submit()">
      <h2 class="forgot__title">{{ 'forgot.heading' | t }}</h2>
      <p class="forgot__intro">{{ 'forgot.intro' | t }}</p>

      <label class="forgot__label" for="forgot-email">{{ 'forgot.email' | t }}</label>
      <input
        #emailInput
        id="forgot-email"
        name="email"
        type="email"
        autocomplete="username"
        class="forgot__input"
        [(ngModel)]="email"
        [disabled]="busy()"
        required
      />

      @if (errorKey(); as key) {
        <p class="forgot__error" role="alert">{{ key | t }}</p>
      }

      <div class="forgot__actions">
        <button
          type="button"
          class="btn btn--text btn--small"
          (click)="backToSignIn()"
          [disabled]="busy()"
        >
          {{ 'forgot.backToSignIn' | t }}
        </button>
        <span class="forgot__spacer"></span>
        <button
          type="button"
          class="btn btn--ghost btn--small"
          (click)="cancel()"
          [disabled]="busy()"
        >
          {{ 'common.actions.cancel' | t }}
        </button>
        <button type="submit" class="btn btn--primary btn--small" [disabled]="busy()">
          {{ (busy() ? 'forgot.sending' : 'forgot.send') | t }}
        </button>
      </div>
    </form>
  }
</dialog>
