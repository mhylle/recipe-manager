server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # --- Service worker control files ---
    # These MUST NOT be cached. ngsw.json is the manifest the worker polls to
    # discover a new build; if an intermediary serves a stale copy the app pins
    # itself to the old version and never updates again. Same for the worker
    # script itself.
    location = /ngsw.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build artefacts are immutable — safe to cache hard.
    location ~* \.(?:js|css|woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
