server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # --- Service worker control files ---
    # These MUST NOT be cached. ngsw.json is the manifest the worker polls to
    # discover a new build; if an intermediary serves a stale copy the app pins
    # itself to the old version and never updates again. Same for the worker
    # script itself.
    location = /ngsw.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # index.html must never be cached. It is the one file that names the current
    # hashed bundles; a stale copy pins the browser to chunks that may already be
    # gone, and the app fails to boot with no obvious cause.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Icons and images are NOT content-hashed — the manifest and the app refer to
    # them by stable name, so `immutable` here would strand a changed icon
    # forever. Cache them, but make the browser revalidate.
    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        try_files $uri =404;
    }

    # Hashed build artefacts are immutable — safe to cache hard.
    location ~* \.(?:js|css|woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
